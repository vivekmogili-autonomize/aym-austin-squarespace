<style>
  .mentor-tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    padding: 14px 18px;
    max-width: 320px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .mentor-tooltip.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const gallery = document.querySelector(".gallery-mentor");
    if (!gallery) return;

    const tooltip = document.createElement("div");
    tooltip.className = "mentor-tooltip";
    document.body.appendChild(tooltip);

    const OFFSET = 16;
    let preferRight = false;

    function positionTooltip(e) {
      const rect = tooltip.getBoundingClientRect();
      let x = preferRight
        ? e.clientX + OFFSET
        : e.clientX - OFFSET - rect.width;
      let y = e.clientY + OFFSET;

      if (preferRight && x + rect.width > window.innerWidth) {
        x = e.clientX - OFFSET - rect.width;
      } else if (!preferRight && x < 0) {
        x = e.clientX + OFFSET;
      }
      if (y + rect.height > window.innerHeight) {
        y = e.clientY - rect.height - OFFSET;
      }

      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    }

    gallery.querySelectorAll("img").forEach(img => {
      img.addEventListener("mouseenter", (e) => {
        const imgRect = img.getBoundingClientRect();
        preferRight = imgRect.left + imgRect.width / 2 < window.innerWidth / 2;

        tooltip.innerHTML = img.getAttribute("data-hover") || "";
        positionTooltip(e);
        tooltip.classList.add("is-visible");
      });

      img.addEventListener("mousemove", positionTooltip);

      img.addEventListener("mouseleave", () => {
        tooltip.classList.remove("is-visible");
      });
    });
  });
</script>
